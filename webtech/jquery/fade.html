<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <title>Document</title>
</head>
<body>
    <center>
        <img id="img1" src="../assets/jalebi.png" alt="" width="200px" height="200px"><br>
        <button type="button" id="btn1">fadeout</button>
        <button type="button" id="btn2">fadein</button>
        <button type="button" id="btn3">fadetoggle</button>
        <hr><br>


        <img id="img2" src="../assets/vadapav.png" alt="" width="200px" height="200px"><br>
        <button type="button" id="btn4">slideup</button>
        <button type="button" id="btn5">slidedown</button>
        <button type="button" id="btn6">slidetoggle</button>
    </center>

    <script>
        $(document).ready(function (){
            $("#btn1").click(()=>{
                $("#img1").fadeOut(2000);
        })
            $("#btn2").click(()=>{

                $("#img1").fadeIn(2000);
        })
            $("#btn3").click(()=>{
                $("#img1").fadeToggle(2000);
        })

        })
        $(document).ready(function (){
            $("#btn4").click(()=>{
                $("#img2").slideUp(2000);
        })
            $("#btn5").click(()=>{

                $("#img2").slideDown(2000);
        })
            $("#btn6").click(()=>{
                $("#img2").slideToggle(2000);
        })

        })
</script>
    
</body>
</html>
