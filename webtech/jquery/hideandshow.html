<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><br>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>
<body>
    <img id="img1" width="300px" src="../assets/jalebi.png" alt="jalebi">
    <button type="button" id="btnhide" >HIDE</button>
    <button type="button" id="btnshow" >show</button>
    <button type="button" id="btntoggle" >toggle</button>
    <hr>
    <center>
        <img id="img2" src="../assets/laddoo.png" alt="">
    </center>
    <script>
        $(document).ready(function(){
            $("#btnhide").click(()=>{$("#img1").hide(2000)});
            $("#btnshow").click(()=>{$("#img1").show(2000)});
            $("#btntoggle").click(()=>{$("#img1").toggle(2000)});

            $("#img2").dblclick(function(){
                $(this).hide(2000,window.alert("image hide successfully"));
            })
        })
    </script>
    
</body>
</html>
