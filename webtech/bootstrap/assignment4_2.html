<body>

    <div class="container mt-3">
        <form action="was-validated">
            <div class="row">
                <div class="form-group col-md-6" >
                <label for="uname" class="form-label">Full Name:</label>
                <input type="text" name="fname" class="form-control" id="uname"  required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
                </div>

            


            <div class="form-group col-md-6">
                <label for="uname" class="form-label">Enter mail:</label>
                <input type="text" name="fname" class="form-control" id="uname" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
            </div>
            </div>


            <div class="form-group">
                <label for="uname" class="form-label">Address-1:</label>
                <input type="text" name="fname" class="form-control" placeholder="1234 Main st" id="uname" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
            </div>


            <div class="form-group">
                <label for="uname" class="form-label">Address-2:</label>

                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
            </div>


            <div class="row">
                <div class="form-group col-md-4">
                <label for="uname" class="form-label">City:</label>
                <input type="text" name="fname" class="form-control" id="uname" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
            </div>


            <div class="form-group col-md-5">
                <label for="" class="form-label">State:</label>
                <select name="state" id="" class="form-control" required>

                    <option value="">Choose your state</option>
                    <option value="Maharastra">Maharastra</option>
                    <option value="Gujrat">Gujrat</option>
                    <option value="Karnata">Karnata</option>
                    <option value="Keral">Keral</option>
                    <option value="Vizag">Vizag</option>
                </select>
            </div>


            <div class="form-group col-md-3">
                <label for="uname" class="form-label">Zip:</label>
                <input type="text" name="fname" class="form-control" id="uname" value="" placeholder="eg:000000" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback"> Invalid data inserted</span>
            </div>

            </div>


           <div class="form-group">
                <label for="" class="form-check-label">
                    <input type="checkbox" name="Condition" class="form-check-input" value="accept" required> I Accept term and Condition
                </label>
            </div>


            <button type="Sign in" class="btn btn-secondary mt-2">Submit</button>
        </form>
