<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <center>
    <img id="d1" src="../Assets/jalebi.png" alt="jalebi" width="500px"><br>
    <h3 id="foodname">jalebi</h3>

   
    <button type="button" class="btn btn-outline-dark btn-lg" onclick="changeImage()">vadapav</button>
    <button type="button" class="btn btn-outline-dark btn-lg" onclick="changeImage1()">jalebi</button>
    <button type="button" class="btn btn-outline-dark btn-lg" onclick="changeImage2()">laddoo</button>
    <script>
        function changeImage() {
        document.getElementById("d1").src="../assets/vadapav.png";
        document.getElementById("foodname").innerHTML="Vadapav";
        }
         function changeImage1() {
        document.getElementById("d1").src="../assets/jalebi.png";
          document.getElementById("foodname").innerHTML="Jalebi";
        }
         function changeImage2() {
        document.getElementById("d1").src="../assets/laddoo.png";
          document.getElementById("foodname").innerHTML="Sweet-laddoo";
        }
    </script></center>


</body>
</html>
