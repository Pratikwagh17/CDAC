<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h2>Table 1</h2></center>
    <table border="3px" width="50%" align="center">
       
        <tbody align="center">
            <tr > 
                <td rowspan="2" colspan="2" bgcolor="red">A</td><td >B</td><td>C</td>
            </tr>
            <tr>
                <td>D</td><td>E</td>
            </tr>
            <tr>
                <td>F</td><td>G</td><td  rowspan="2" colspan="2" bgcolor="green">H</td>
            </tr>
            <tr>
                <td>I</td><td>J</td>
            </tr>
        </tbody>
    </table><br><hr color="red" size="5px">

    <center>
    <h2>Table 2</h2>
    
    <table border="" width="50%">
        
        <tbody align="center">
            <tr > 
                <td rowspan="3" bgcolor="yellow">A</td><td>B</td><td>C</td>
            </tr>
            <tr>
                <td  colspan="2" bgcolor="blue">D</td>
            </tr>
            <tr>
                <td >E</td><td rowspan="2" bgcolor="green">F</td>
            </tr>
            <tr>
                <td>G</td><td>H</td>
            </tr>
        </tbody>
    </table>
</center>
    
</body>
</html>
