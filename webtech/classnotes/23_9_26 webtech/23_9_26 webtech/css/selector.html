<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     /* 1. element name selector  */
     h2{
        color: blue;
        text-align: center;
        background-color: aqua;
     }
     /* 2. group selector  */
     strong,b,u{
        color: orange;
        font-size: 30px;
        text-transform: uppercase;
     }
     /* 3. id selector  */
     #d5{
        color: aqua;
        text-align: center;
     }
     /* 4. class selector  */
     .cls1{
        color: green;
        font-size: 30px;
        text-align: right;
     }
     /* 5. universal selector  */
     *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
     }
    </style>
</head>
<body>
    <h2>Panchashil Wankhede</h2>
    <strong>Sanket</strong>,
    <b>Saurabh</b>,<u>Paras</u>
    <div class="cls1">this is div-1</div>
    <div class="cls1">this is div-2</div>
    <div class="cls1">this is div-3</div>
    <div class="cls1">this is div-4</div>
    <div id="d5">this is div-5</div>
    <div>this is div-6</div>
</body>
</html>
