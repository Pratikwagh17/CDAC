<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .borderprop {
            /* border-style: solid; */
            /* border-color: red; */
            /* border-width: 10px; */
            border: 10px solid red;
            color: mediumblue;
            font-size: 20px;
            word-spacing: 10px;
            letter-spacing: 2px;
            line-height: 25px;
            text-transform: uppercase;
            text-shadow: 2px 1px 2px black;
            font-weight: 700;
            padding: 6px;
        }

        .boxmodel {
            border: 5px solid green;
            width: 146px;
            padding: 10px 20px 30px 40px;
            border-width: 10px 15px 20px 25px;
            margin: 15px 20px 25px 30px;
        }

        .circle {
            border: 3px solid blue;
            height: 100px;
            width: 100px;
            border-radius: 50%;
        }

        .b1 {
            border: 5px solid;
            width: 100px;
            font-size: 40px;
            text-align: center;
            padding: 0px 5px;
        }
        .b2 {
            border: 5px solid;
            width: 100px;
            font-size: 40px;
            text-align: center;
            padding: 0px 5px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <p class="borderprop">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem, ex quo voluptatem autem sequi quod adipisci
        dolores aperiam consequuntur blanditiis alias ea id iste reiciendis modi, eligendi sit nam nesciunt!
    </p>
    <div class="boxmodel">
        Panchashil Wankhede
    </div>

    <img class="circle" src="../Assetes/jalebi.jpg" alt="jalebi">
    <div class="b1">hello</div>
    <div class="b2">hello</div>
</body>

</html>
