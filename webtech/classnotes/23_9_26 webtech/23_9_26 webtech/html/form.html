<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form method="get">
     <label for="txt1">Enter your fullname:</label><br>
     <input type="text" name="fname" id="txt1" placeholder="enter your fullname"
     minlength="2" maxlength="20" pattern="^[a-zA-Z ]{2,20}$" required> <br>
    <label for="txt2">Enter your password:</label><br>
     <input type="password" name="pass" id="txt2" placeholder="enter your password" pattern="^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{6,16}$" required> <br>
    <label for="">Enter your Email:</label><br>
    <input type="email" name="uemail" required> <br>

    <label for="">Enter your contact:</label><br>
    <input type="tel" name="ucontact" pattern="^[0-9]{10,11}$" required> <br>

    <label for="">Enter your Age:</label><br>
    <input type="number" name="uage" min="18" max="60" required> <br>

     <label for="">Select Your DOB:</label><br>
    <input type="date" name="udob"  required> <br>
     
    <label for="">Select your gender:</label>
    <input type="radio" name="gender" value="male" checked required>Male
    <input type="radio" name="gender" value="female" required>Female
    <input type="radio" name="gender" value="transgender" required>Transgender
    <br>
<label for="">Select Your Qualification</label><br>
<input type="checkbox" name="edu" value="ssc">SSC
<input type="checkbox" name="edu" value="hsc">HSC
<input type="checkbox" name="edu" value="ug">UG
<input type="checkbox" name="edu" value="pg">PG 
<br>
<label for="">Select your Course:</label>
<select name="course" multiple id="">
   <option value="react">React</option>
   <option value="angular">Angular</option>
   <option value="java">Java</option>
   <option value="python">Python</option>
</select> <br>
<label for="">fees:</label>
<input type="text" name="fees" value="10000" readonly disabled> <br>
 <label for="">Enter your feedback</label><br>
 <textarea name="feedback" id=""></textarea><br>

     <button type="submit">submit</button>
     <button type="reset">Reset</button>
</form>

</body>
</html>
