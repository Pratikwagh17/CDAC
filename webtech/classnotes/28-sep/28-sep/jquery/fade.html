<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>
<body>
    <center>
        <img id="img1" src="../Assetes/poha.jpg" alt="poha" width="100%" height="300px"> <br>
        <button type="button" id="btn1">FadeOut</button>
        <button type="button" id="btn2">FadeIn</button>
        <button type="button" id="btn3">FadeToogle</button>
        <hr>

        <button type="button" id="btn4">SlideUp</button>
        <button type="button" id="btn5">SlideDown</button>
        <button type="button" id="btn6">slideToggle</button>
        <img id="img2" src="../Assetes/vadapav.jpg" alt="poha" width="100%" height="300px">
       
    </center>
    

<script>
$(document).ready(function (){
    $("#btn1").click(()=>{
        $("#img1").fadeOut(2000);
    })
    $("#btn2").click(()=>{
        $("#img1").fadeIn(2000);
    })
    $("#btn3").click(()=>{
        $("#img1").fadeToggle(2000);
    })
// slideup,slidedown 
    $("#btn4").click(()=>{
        $("#img2").slideUp(2000);
    })
    $("#btn5").click(()=>{
        $("#img2").slideDown(2000);
    })
      $("#btn6").click(()=>{
        $("#img2").slideToggle(2000);
    })

})
</script>

</body>
</html>
