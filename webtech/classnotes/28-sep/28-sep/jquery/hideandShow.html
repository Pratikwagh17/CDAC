<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>

<body>
    <center>
        <img id="img1" src="../Assetes/samosa.jpg" alt="samosa"> <br>
        <button type="button" id="btnhide">Hide</button>
        <button type="button" id="btnshow">Show</button>
        <button type="button" id="btntoogle">Toogle</button>
    </center>
    <hr>
    <center>
        <img id="img2" src="../Assetes/jalebi.jpg" alt="jalebi">
        <div>Double click on image</div>
    </center>
    <script>
        $(document).ready(function () {
            $("#btnhide").click(() => { $("#img1").hide(2000) });
            $("#btnshow").click(() => { $("#img1").show(2000) });
            $("#btntoogle").click(() => { $("#img1").toggle(2000) });
           
            $("#img2").dblclick(function (){
                $(this).hide(2000,window.alert("image hide successfully"));
            })

        })
    </script>
</body>

</html>
