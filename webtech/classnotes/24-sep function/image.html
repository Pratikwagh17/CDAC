<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>
        .myimg{
            border: 2px solid red;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
      <!-- button classes  -->
      <button type="button">simple</button>
      <button type="button" class="btn">simple</button>
      <button type="button" class="btn btn-primary">simple</button>
      <button type="button" class="btn btn-success">simple</button> <br>
      <!--  button outline class -->
     <button type="button" class="btn btn-outline-danger">simple</button> 
     <button type="button" class="btn btn-outline-warning">simple</button> <br><br> <!--  button outline sizeclass -->
     <button type="button" class="btn btn-primary btn-lg">simple</button>
     <button type="button" class="btn btn-primary">simple</button>
     <button type="button" class="btn btn-primary btn-sm">simple</button>
     <br><br> <!--  button with fullwidth class -->
     <div class="d-grid">
         <button type="button" class="btn btn-primary">simple</button>
     </div>
      <hr>
      <!-- spinner-border  -->
       <span class="spinner-border"></span>
       <span class="spinner-border text-success"></span>
       <span class="spinner-border text-success spinner-border-sm"></span>
        <button type="button" class="btn btn-primary">
         <span class="spinner-border text-danger spinner-border-sm"></span> loading...
        </button><br>
        <!-- spinner-grow  -->
       <span class="spinner-grow"></span>
        <span class="spinner-grow text-danger"></span>
        <span class="spinner-grow text-danger spinner-grow-sm"></span>
        <button type="button" class="btn btn-primary">
          <span class="spinner-grow text-danger spinner-grow-sm"></span> loading...
        </button>
      <hr>
      <!-- image classes  -->
       <img class="myimg rounded" src="../Assetes/samosa.jpg" alt="samosa" >
       <img class="myimg rounded-circle" src="../Assetes/vadapav.jpg" alt="vadapav" >
       <img class="myimg img-thumbnail" src="../Assetes/poha.jpg" alt="poha">
       <hr>
       <!-- color classes  -->
        <h2 class="text-primary bg-danger">Hello Friends How are you all</h2>
        <h2 class="text-seconday bg-primary">Hello Friends How are you all</h2>
        <h2 class="text-info bg-success">Hello Friends How are you all</h2>
        <h2 class="text-danger bg-secondary">Hello Friends How are you all</h2>
        <h2 class="text-warning">Hello Friends How are you all</h2>
        <h2 class="text-success">Hello Friends How are you all</h2>
        <h2 class="text-white bg-dark">Hello Friends How are you all</h2>
        <h2 class="text-muted">Hello Friends How are you all</h2>
        <h2 class="text-dark">Hello Friends How are you all</h2>
    </div>
</body>
</html>
