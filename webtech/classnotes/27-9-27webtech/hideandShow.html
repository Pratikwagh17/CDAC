<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 3px solid red;
            width: 300px;
            margin: auto;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <img id="img1" src="../Assetes/samosa.jpg" alt="samosa"><br>
        <button type="button" onclick="changeImg('none')">Hide</button>
        <button type="button" onclick="changeImg('inline')">Show</button>
    </div>
    <script>
        function changeImg(val) {
            document.getElementById("img1").style.display = val;
        }
    </script>

</body>

</html>
