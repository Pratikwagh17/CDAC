<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div id="d"></div>
    <script>
    let obj=new Date();
    function myclock() {
            let dobj=new Date();
            document.getElementById("d").innerHTML=dobj.toLocaleTimeString();
        }
       setInterval(myclock,1000);
</script>
    
</body>
