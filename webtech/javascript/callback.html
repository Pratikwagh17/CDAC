<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="d1">Good morning</h2>
    <h2 >counter :<span id="d2"></span></h2>
    <script>
        function greeting(){
            document.getElementById("d1").innerHTML="good morning";

        }
        setTimeout(greeting,1000);

        let cout = 0;
        function counter(){

            cout+=1;
            document.getElementById("d2").innerHTML=cout;
        }
        setInterval(counter,1000);
    </script>

</body>
</html>
