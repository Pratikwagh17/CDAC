<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <div id="d7"></div>
    <div id="d8"></div>
    <div id="d9"></div>
    <div id="d10"></div>
    <div id="d11"></div>
    <div id="d12"></div>
    <div id="d13"></div>
    <div id="d14"></div>
    <div id="d15"></div>
    <div id="d16"></div>

    <script>
        let obj=new Date();
        document.getElementById("d1").innerHTML=obj;
        document.getElementById("d2").innerHTML=obj.getDate();
        document.getElementById("d3").innerHTML=obj.getFullYear();
        document.getElementById("d4").innerHTML=obj.getHours();
        document.getElementById("d5").innerHTML=obj.getMinutes();
        document.getElementById("d6").innerHTML=obj.getMonth()+1;
        document.getElementById("d7").innerHTML=obj.getSeconds();
        document.getElementById("d8").innerHTML=obj.getTime();
        //  document.getElementById("d9").innerHTML=obj.

        //digital clock
        function myclock() {
            let dobj=new Date();
            document.getElementById("d9").innerHTML=dobj.toLocaleTimeString();
        }
       setInterval(myclock);
       
        //how to set date and time
        let myDate=new Date("2025","02","10","10","30","45");
        document.getElementById("d10").innerHTML=myDate;
    </script>
</body>
</html>
